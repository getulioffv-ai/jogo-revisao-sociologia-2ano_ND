<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilha Sociológica — Revisão do 3º trimestre</title>
<meta name="description" content="Jogo de revisão de Sociologia para a 2ª série do Ensino Médio: desigualdade, Foucault, controle social, trabalho e ética no ambiente virtual.">
<style>
:root{
  --verde:#1E5631; --verde2:#2E7D52; --escuro:#143823; --ouro:#C9962B; --ouro-claro:#F6E7C1;
  --vinho:#9C2B2B; --vinho-claro:#F7E3E1; --ok:#1F7A46; --ok-claro:#E0F1E6;
  --fundo:#F4EFE3; --papel:#FFFDF8; --linha:#DDD3BE; --texto:#1F2A22; --suave:#5C665E;
  --raio:16px; --sombra:0 2px 0 rgba(20,56,35,.12), 0 10px 24px rgba(20,56,35,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
h1,h2,h3,p{margin:0}

.topo{background:var(--verde);color:#fff;position:sticky;top:0;z-index:5}
.topo-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.marca{background:none;border:0;color:#fff;font-weight:800;letter-spacing:.2px;padding:6px 0;text-align:left;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca small{display:block;font-weight:500;opacity:.8;font-size:12px;letter-spacing:.6px;text-transform:uppercase}
.placar{display:flex;gap:8px;flex-shrink:0}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.pill b{color:#FFE29A}
.barra{height:6px;background:rgba(255,255,255,.18)}
.barra i{display:block;height:100%;width:0;background:var(--ouro);transition:width .35s ease}

main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:20px 16px 40px}
.rodape{text-align:center;color:var(--suave);font-size:13px;padding:16px}

/* início */
.capa{background:var(--escuro);color:#fff;border-radius:22px;padding:26px 22px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.capa::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:26px solid rgba(201,150,43,.28)}
.capa .sobre{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#FFE29A;font-weight:700}
.capa h1{font-size:clamp(28px,7vw,40px);line-height:1.1;margin:6px 0 10px;position:relative;z-index:1}
.capa p{max-width:520px;opacity:.92;position:relative;z-index:1}
.resumo{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.resumo span{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;font-size:14px}
.resumo b{color:#FFE29A;font-size:18px}

.sec{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--suave);font-weight:800;margin:26px 4px 10px}
.trilha{display:grid;gap:12px}
.fase{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--papel);border:2px solid var(--linha);border-radius:var(--raio);padding:14px;box-shadow:var(--sombra);transition:border-color .12s ease,box-shadow .12s ease}
.fase:hover{border-color:var(--verde2);box-shadow:0 0 0 3px rgba(46,125,82,.18),var(--sombra)}
.num{flex:0 0 52px;height:52px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.fase.feita .num{background:var(--ouro);color:var(--escuro)}
.fase .txt{flex:1;min-width:0}
.fase .cap{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--verde2);font-weight:800}
.fase h3{font-size:19px;line-height:1.2}
.fase .tema{color:var(--suave);font-size:14.5px}
.estrelas{font-size:20px;letter-spacing:2px;color:#CFC6B2;white-space:nowrap}
.estrelas .on{color:var(--ouro)}
.fase.relampago{background:var(--ouro-claro);border-color:var(--ouro)}
.fase.relampago .num{background:var(--vinho)}
.como{background:var(--papel);border:2px dashed var(--linha);border-radius:var(--raio);padding:14px 16px;color:var(--suave);font-size:15.5px}
.como b{color:var(--texto)}

/* rodada */
.cab{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.cab .onde{font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--verde2);font-weight:800}
.cab h2{font-size:clamp(22px,5.4vw,28px);line-height:1.15}
.cab .cont{margin-left:auto;background:var(--papel);border:2px solid var(--linha);border-radius:999px;padding:4px 12px;font-weight:800;color:var(--verde);white-space:nowrap}
.dica{color:var(--suave);font-size:15.5px;margin:6px 0 16px}

.carta{background:var(--papel);border:2px solid var(--linha);border-radius:20px;padding:22px 18px;box-shadow:var(--sombra);font-size:clamp(19px,4.6vw,23px);font-weight:700;line-height:1.3;text-align:center;min-height:120px;display:grid;place-items:center}
.carta.pergunta{font-size:clamp(17px,4.2vw,20px);font-weight:600;text-align:left;place-items:start}
.opcoes{display:grid;gap:10px;margin-top:14px}
.opcoes.baldes{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.op{background:var(--papel);border:2px solid var(--verde);border-radius:14px;padding:13px 14px;min-height:52px;font-weight:700;text-align:left;color:var(--escuro);transition:background .12s ease,box-shadow .12s ease}
.baldes .op{text-align:center;background:var(--verde);color:#fff}
.op:hover:not(:disabled){box-shadow:0 0 0 3px rgba(46,125,82,.25)}
.op:disabled{cursor:default;opacity:.55}
.op.certa{background:var(--ok-claro);border-color:var(--ok);color:#0E4A29;opacity:1}
.op.errada{background:var(--vinho-claro);border-color:var(--vinho);color:#6E1D1D;opacity:1}
.op.certa::before{content:"✓ ";font-weight:900}
.op.errada::before{content:"✗ ";font-weight:900}

.retorno{margin-top:16px;border-radius:var(--raio);padding:14px 16px;border:2px solid var(--ok);background:var(--ok-claro)}
.retorno.nao{border-color:var(--vinho);background:var(--vinho-claro)}
.retorno strong{display:block;font-size:17px}
.retorno p{margin-top:2px}
.retorno .resp{font-weight:700;margin-top:4px}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{background:var(--verde);color:#fff;border:0;border-radius:14px;padding:13px 20px;font-weight:800;min-height:50px}
.btn.sec2{background:transparent;color:var(--verde);border:2px solid var(--verde)}
.btn.ouro{background:var(--ouro);color:var(--escuro)}
.btn:hover{filter:brightness(1.07)}

/* pares */
.fichas{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:64px;background:var(--fundo);padding:8px 0;z-index:3}
.ficha{background:var(--papel);border:2px solid var(--verde);border-radius:999px;padding:9px 14px;font-weight:800;color:var(--verde);min-height:44px}
.ficha.sel{background:var(--verde);color:#fff}
.ficha:disabled{opacity:.35;text-decoration:line-through;cursor:default}
.descs{display:grid;gap:10px;margin-top:8px}
.desc{background:var(--papel);border:2px solid var(--linha);border-radius:14px;padding:13px 14px;text-align:left;min-height:52px;width:100%}
.desc.sel{border-color:var(--ouro);background:var(--ouro-claro)}
.desc.ok{border-color:var(--ok);background:var(--ok-claro);cursor:default}
.desc .tag{display:inline-block;background:var(--ok);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;margin-bottom:4px}
.desc .ex{display:block;color:#0E4A29;font-size:14.5px;margin-top:4px}
.treme{animation:treme .32s}
@keyframes treme{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.aviso{min-height:26px;margin-top:10px;font-weight:700;color:var(--vinho)}

/* ordem */
.lista{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.lista li{display:flex;align-items:center;gap:10px;background:var(--papel);border:2px solid var(--linha);border-radius:14px;padding:8px 10px}
.lista .pos{flex:0 0 30px;height:30px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.lista .tx{flex:1;font-weight:600}
.lista .ano{font-weight:800;color:var(--verde);margin-right:6px}
.seta{flex:0 0 44px;height:44px;border-radius:12px;border:2px solid var(--verde);background:#fff;font-size:18px;font-weight:800;color:var(--verde)}
.seta:disabled{opacity:.3;cursor:default}
.lista li.ok{border-color:var(--ok);background:var(--ok-claro)}
.lista li.no{border-color:var(--vinho);background:var(--vinho-claro)}

/* fim de fase */
.fim{background:var(--papel);border:2px solid var(--linha);border-radius:22px;padding:26px 20px;text-align:center;box-shadow:var(--sombra)}
.fim .estrelas{font-size:46px;letter-spacing:6px;display:block;margin:6px 0}
.fim h2{font-size:26px}
.fim .nums{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.fim .nums div{background:var(--fundo);border-radius:14px;padding:10px 16px;min-width:110px}
.fim .nums b{display:block;font-size:26px;color:var(--verde)}
.fim .nums span{font-size:13px;color:var(--suave)}
.fim .acoes{justify-content:center}
.rever{text-align:left;margin-top:18px}
.rever h3{font-size:15px;letter-spacing:.8px;text-transform:uppercase;color:var(--vinho);margin-bottom:8px}
.rever ul{margin:0;padding-left:20px}
.rever li{margin-bottom:8px}
.rever li span{display:block;color:var(--suave);font-size:15px}

/* relâmpago */
.relogio{font-variant-numeric:tabular-nums}
.relogio.fim-tempo{color:var(--vinho);border-color:var(--vinho)}
.vf{grid-template-columns:1fr 1fr}
.vf .op{text-align:center;font-size:19px;min-height:64px}
.vf .v{background:var(--ok);border-color:var(--ok);color:#fff}
.vf .f{background:var(--vinho);border-color:var(--vinho);color:#fff}
.flash-ok{animation:fok .35s}
.flash-no{animation:fno .35s}
@keyframes fok{0%{background:var(--ok-claro);border-color:var(--ok)}100%{}}
@keyframes fno{0%{background:var(--vinho-claro);border-color:var(--vinho)}100%{}}

@media (min-width:700px){
  .trilha{grid-template-columns:1fr 1fr}
  .fase.relampago{grid-column:1/-1}
  .capa{padding:34px 32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <button class="marca" id="marca" type="button" aria-label="Voltar à trilha"><small>Sociologia · 2ª série</small>Trilha Sociológica</button>
    <div class="placar"><span class="pill" aria-label="Pontos"><b id="pts">0</b> pts</span><span class="pill" aria-label="Estrelas"><b id="est">0</b>/15 ★</span></div>
  </div>
  <div class="barra" aria-hidden="true"><i id="barra"></i></div>
</header>
<main id="app"></main>
<footer class="rodape">Colégio Notre Dame Ipanema · Sociologia · 3º trimestre de 2026 · Prof. Getulio Fidelis</footer>

    var n = document.createElement(tag), k;
    attrs = attrs || {};
    for (k in attrs) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (filhos || []).forEach(function (f) { if (f) n.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return n;
  }
  function embaralhar(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function estrelasDe(acertos, total) {
    var p = total ? acertos / total : 0;
    return p >= 0.9 ? 3 : p >= 0.7 ? 2 : p >= 0.5 ? 1 : 0;

  function estrelasEl(n) {
    var s = el("span", { class: "estrelas", "aria-label": n + " de 3 estrelas" });

    return s;
  }

        el("div", { class: "sobre", text: "Revisão · 3º trimestre" }),
        el("h1", { text: "Trilha Sociológica" }),
        el("p", { text: "Cinco fases, uma para cada capítulo estudado. Classifique, combine, ordene e resolva casos para chegar à prova com o conteúdo em dia." }),
        el("div", { class: "resumo" }, [
          el("span", {}, [el("b", { text: feitas + "/5" }), " fases concluídas"]),
          el("span", {}, [el("b", { text: String(totalEstrelas()) }), " de 15 estrelas"]),
          el("span", {}, [el("b", { text: String(estado.pts) }), " pontos"])
        ])
      ]),
      el("h2", { class: "sec", text: "Escolha uma fase" }),
      trilha,
      el("h2", { class: "sec", text: "Como funciona" }),
      el("div", { class: "como" }, [
        el("b", { text: "Vale a primeira tentativa. " }),
        "Cada acerto de primeira rende " + PONTOS + " pontos. Com 90% de acertos, a fase vale 3 estrelas; com 70%, 2; com 50%, 1. Você pode repetir as fases quantas vezes quiser: fica guardada a sua melhor marca. Leia sempre a explicação que aparece depois de cada resposta: é ela que ajuda a estudar."
      ]),
      (feitas || estado.pts) ? el("div", { class: "acoes" }, [botao("Zerar meu progresso", function () {
        estado = { pts: 0, melhor: {}, relampago: 0 }; salvar(); inicio();
      }, "sec2")]) : null
    ]);
  }

  // ---------- fase ----------
  function jogarFase(i) {
    var fase = FASES[i];
    var total = fase.rodadas.reduce(function (s, r) { return s + r.itens.length; }, 0);
    var st = { acertos: 0, feitos: 0, total: total, erros: [] };
    var r = 0;
    function progresso() { barra(st.feitos / st.total); }
    function proxima() {
      if (r >= fase.rodadas.length) return fimFase(i, st);
      var rod = fase.rodadas[r];
      var onde = fase.cap + " · rodada " + (r + 1) + " de " + fase.rodadas.length;
      r++;
      MOTORES[rod.tipo](rod, onde, st, progresso, proxima);
    }
    progresso();
    proxima();
  }

  function registrar(st, certo, pergunta, explicacao) {
    st.feitos++;
    if (certo) { st.acertos++; ganhar(PONTOS); }
    else st.erros.push([pergunta, explicacao]);
  }

  var MOTORES = {};

  // classificar: uma carta por vez, dois ou três baldes
  MOTORES.sort = function (rod, onde, st, progresso, fim) {
    var itens = embaralhar(rod.itens), k = 0;
    function mostrar() {
      if (k >= itens.length) return fim();
      var it = itens[k], respondido = false;
      var ops = el("div", { class: "opcoes baldes" });
      var area = el("div");
      rod.baldes.forEach(function (b, bi) {
        ops.appendChild(el("button", { class: "op", type: "button", text: b, onclick: function () {
          if (respondido) return; respondido = true;
          var certo = bi === it[1];
          Array.prototype.forEach.call(ops.children, function (o, oi) {
            o.disabled = true;
            if (oi === it[1]) o.classList.add("certa"); else if (oi === bi) o.classList.add("errada");
          });
          registrar(st, certo, it[0] + " → " + rod.baldes[it[1]], it[2]); progresso();
          area.appendChild(retorno(certo, certo ? "Isso mesmo!" : "Ainda não.", it[2], certo ? null : "Resposta: " + rod.baldes[it[1]] + "."));
          var b2 = botao(k + 1 < itens.length ? "Próxima carta" : "Continuar", function () { k++; mostrar(); });
          area.appendChild(el("div", { class: "acoes" }, [b2])); b2.focus();
        } }));
      });
      tela([cabecalho(onde, rod.titulo, (k + 1) + "/" + itens.length), el("p", { class: "dica", text: rod.dica }),
        el("div", { class: "carta", text: it[0] }), ops, area]);
    }
    mostrar();
  };

  // caso a caso: pergunta com quatro alternativas
  MOTORES.quiz = function (rod, onde, st, progresso, fim) {
    var itens = embaralhar(rod.itens), k = 0;
    function mostrar() {
      if (k >= itens.length) return fim();
      var it = itens[k], certaTxt = it[1][0], respondido = false;
      var ops = el("div", { class: "opcoes" });
      var area = el("div");
      embaralhar(it[1]).forEach(function (txt) {
        ops.appendChild(el("button", { class: "op", type: "button", text: txt, onclick: function (ev) {
          if (respondido) return; respondido = true;
          var certo = txt === certaTxt;
          Array.prototype.forEach.call(ops.children, function (o) {
            o.disabled = true;
            if (o.textContent === certaTxt) o.classList.add("certa"); else if (o === ev.currentTarget) o.classList.add("errada");
          });
          registrar(st, certo, it[0], certaTxt + " " + it[2]); progresso();
          area.appendChild(retorno(certo, certo ? "Isso mesmo!" : "Ainda não.", it[2]));
          var b2 = botao(k + 1 < itens.length ? "Próxima pergunta" : "Continuar", function () { k++; mostrar(); });
          area.appendChild(el("div", { class: "acoes" }, [b2])); b2.focus();
        } }));
      });
      tela([cabecalho(onde, rod.titulo, (k + 1) + "/" + itens.length), el("p", { class: "dica", text: rod.dica }),
        el("div", { class: "carta pergunta", text: it[0] }), ops, area]);
    }
    mostrar();
  };

  // pares: toque no nome e na descrição
  MOTORES.match = function (rod, onde, st, progresso, fim) {
    var selF = null, selD = null, feitos = 0;
    var errou = rod.itens.map(function () { return false; });
    var fichas = el("div", { class: "fichas", role: "group", "aria-label": "Conceitos" });
    var descs = el("div", { class: "descs" });
    var aviso = el("p", { class: "aviso", role: "status" });
    var area = el("div");
    var botF = [], botD = [];

    function limpar() {
      botF.forEach(function (b) { b.classList.remove("sel"); b.setAttribute("aria-pressed", "false"); });
      botD.forEach(function (b) { b.classList.remove("sel"); });
      selF = null; selD = null;
    }
    function avaliar() {
      if (selF === null || selD === null) return;
      var f = selF, d = selD, it = rod.itens[d];
      if (it[1] === f) {
        var b = botD[d];
        b.classList.remove("sel"); b.classList.add("ok"); b.disabled = true;
        b.insertBefore(el("span", { class: "tag", text: rod.fichas[f] }), b.firstChild);
        b.insertBefore(document.createElement("br"), b.childNodes[1]);
        b.appendChild(el("span", { class: "ex", text: it[2] }));
        botF[f].disabled = true;
        registrar(st, !errou[d], rod.fichas[f] + ": " + it[0], it[2]); progresso();
        feitos++; aviso.textContent = "";
        document.getElementById("cont").textContent = feitos + "/" + rod.itens.length;
        limpar();
        if (feitos === rod.itens.length) {
          var b2 = botao("Continuar", fim);
          area.appendChild(retorno(true, "Todos os pares formados!", "Releia as explicações em verde antes de seguir."));
          area.appendChild(el("div", { class: "acoes" }, [b2])); b2.focus();
        }
      } else {
        errou[d] = true;
        [botF[f], botD[d]].forEach(function (x) { x.classList.remove("treme"); void x.offsetWidth; x.classList.add("treme"); });
        aviso.textContent = "Esse par não combina. Tente outra descrição.";
        limpar();
      }
    }
    rod.fichas.forEach(function (nome, fi) {
      var b = el("button", { class: "ficha", type: "button", text: nome, "aria-pressed": "false", onclick: function () {
        var era = selF === fi;
        botF.forEach(function (x) { x.classList.remove("sel"); x.setAttribute("aria-pressed", "false"); });
        selF = era ? null : fi;
        if (!era) { b.classList.add("sel"); b.setAttribute("aria-pressed", "true"); }
        avaliar();
      } });
      botF.push(b);
    });
    embaralhar(botF).forEach(function (b) { fichas.appendChild(b); });
    var ordem = embaralhar(rod.itens.map(function (_, i) { return i; }));
    rod.itens.forEach(function (it, di) {
      var b = el("button", { class: "desc", type: "button", onclick: function () {
        var era = selD === di;
        botD.forEach(function (x) { x.classList.remove("sel"); });
        selD = era ? null : di;
        if (!era) b.classList.add("sel");
        avaliar();
      } }, [el("span", { text: it[0] })]);
      botD[di] = b;
    });
    ordem.forEach(function (di) { descs.appendChild(botD[di]); });
    tela([cabecalho(onde, rod.titulo, "0/" + rod.itens.length), el("p", { class: "dica", text: rod.dica }), fichas, descs, aviso, area]);
  };

  // ordenar: setas para subir e descer
  MOTORES.order = function (rod, onde, st, progresso, fim) {
    var n = rod.itens.length, ordem;
    do { ordem = embaralhar(rod.itens.map(function (_, i) { return i; })); }
    while (ordem.every(function (v, i) { return v === i; }));
    var lista = el("ol", { class: "lista" });
    var area = el("div");
    var conferido = false;
    function desenhar(focar) {
      lista.innerHTML = "";
      ordem.forEach(function (idx, pos) {
        var certo = idx === pos;
        var li = el("li", { class: conferido ? (certo ? "ok" : "no") : "" }, [
          el("span", { class: "pos", text: String(pos + 1), "aria-hidden": "true" }),
          el("span", { class: "tx" }, [conferido ? el("span", { class: "ano", text: rod.itens[idx][0] }) : null, rod.itens[idx][1]])
        ]);
        if (!conferido) {
          var sobe = el("button", { class: "seta", type: "button", text: "▲", "aria-label": "Subir: " + rod.itens[idx][1], onclick: function () { mover(pos, -1); } });
          var desce = el("button", { class: "seta", type: "button", text: "▼", "aria-label": "Descer: " + rod.itens[idx][1], onclick: function () { mover(pos, 1); } });
          if (pos === 0) sobe.disabled = true;
          if (pos === n - 1) desce.disabled = true;
          li.appendChild(sobe); li.appendChild(desce);
          if (focar && focar[0] === pos) setTimeout(function () { (focar[1] < 0 ? (sobe.disabled ? desce : sobe) : (desce.disabled ? sobe : desce)).focus(); }, 0);
        }
        lista.appendChild(li);
      });
    }
    function mover(pos, d) {
      var alvo = pos + d; if (alvo < 0 || alvo >= n) return;
      var t = ordem[pos]; ordem[pos] = ordem[alvo]; ordem[alvo] = t;
      desenhar([alvo, d]);
    }
    var bConf = botao("Conferir a ordem", function () {
      conferido = true;
      var certos = 0;
      ordem.forEach(function (idx, pos) {
        var ok = idx === pos; if (ok) certos++;
        registrar(st, ok, rod.itens[idx][0] + " — " + rod.itens[idx][1], "Na linha do tempo, esse acontecimento ocupa a " + (idx + 1) + "ª posição.");
      });
      progresso();
      desenhar();
      area.innerHTML = "";
      var tudo = certos === n;
      area.appendChild(retorno(tudo, tudo ? "Linha do tempo perfeita!" : certos + " de " + n + " na posição certa.",
        rod.fecho, tudo ? null : "Ordem correta: " + rod.itens.map(function (x) { return x[0]; }).join(" → ") + "."));
      var b2 = botao("Continuar", fim);
      area.appendChild(el("div", { class: "acoes" }, [b2])); b2.focus();
    });
    area.appendChild(el("div", { class: "acoes" }, [bConf]));
    desenhar();
    tela([cabecalho(onde, rod.titulo, n + " itens"), el("p", { class: "dica", text: rod.dica }), lista, area]);
  };

  // ---------- fim de fase ----------
  function fimFase(i, st) {
    var fase = FASES[i];
    var n = estrelasDe(st.acertos, st.total);
    var recorde = estado.melhor[fase.id] === undefined || n > estado.melhor[fase.id];
    if (recorde) { estado.melhor[fase.id] = n; salvar(); }
    barra(1);
    var msg = n === 3 ? "Conteúdo dominado!" : n === 2 ? "Muito bem! Falta pouco." : n === 1 ? "Bom começo. Vale repetir a fase." : "Releia o capítulo e tente outra vez.";
    var rever = null;
    if (st.erros.length) {
      var ul = el("ul");
      st.erros.forEach(function (e) { ul.appendChild(el("li", {}, [el("b", { text: e[0] }), el("span", { text: e[1] })])); });
      rever = el("div", { class: "rever" }, [el("h3", { text: "Para rever antes da prova" }), ul]);
    }
    var acoes = el("div", { class: "acoes" }, [
      botao("Jogar de novo", function () { jogarFase(i); }, "sec2"),
      i + 1 < FASES.length ? botao("Próxima fase", function () { jogarFase(i + 1); }) : botao("Desafio relâmpago", relampago, "ouro"),
      botao("Voltar à trilha", inicio, "sec2")
    ]);
    tela([el("section", { class: "fim" }, [
      el("div", { class: "onde", text: fase.cap + " · " + fase.nome, style: "font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--verde2);font-weight:800" }),
      (function () { var s = estrelasEl(n); return s; })(),
      el("h2", { text: msg }),
      el("div", { class: "nums" }, [
        el("div", {}, [el("b", { text: st.acertos + "/" + st.total }), el("span", { text: "acertos de primeira" })]),
        el("div", {}, [el("b", { text: Math.round(100 * st.acertos / st.total) + "%" }), el("span", { text: "aproveitamento" })]),
        el("div", {}, [el("b", { text: String(st.acertos * PONTOS) }), el("span", { text: "pontos na fase" })])
      ]),
      acoes, rever
    ])]);
    acoes.children[1].focus();
  }

  // ---------- desafio relâmpago ----------
  var cronometro = null;
  function parar() { if (cronometro) { clearInterval(cronometro); cronometro = null; } }
  function relampago() {
    parar();
    var TEMPO = 90;
    tela([
      cabecalho("Todos os capítulos", "Desafio relâmpago"),
      el("p", { class: "dica", text: "Você terá " + TEMPO + " segundos para julgar o maior número de afirmações. Cada acerto vale 5 pontos. No fim, você vê as explicações do que errou." }),
      el("div", { class: "acoes" }, [botao("Começar", function () { rodar(TEMPO); }, "ouro"), botao("Voltar à trilha", inicio, "sec2")])
    ]);
    barra(0);
  }
  function rodar(TEMPO) {
    var fila = embaralhar(BLITZ), k = 0, acertos = 0, erros = [], resta = TEMPO, acabou = false;
    var carta = el("div", { class: "carta" });
    var rel = el("div", { class: "cont relogio", id: "cont", text: resta + " s", role: "timer" });
    var marcador = el("p", { class: "dica", text: "Acertos: 0" });
    function fimJogo() {
      if (acabou) return; acabou = true; parar();
      ganhar(acertos * 5);
      if (acertos > estado.relampago) { estado.relampago = acertos; salvar(); }
      var rever = null;
      if (erros.length) {
        var ul = el("ul");
        erros.forEach(function (e) { ul.appendChild(el("li", {}, [el("b", { text: e[0] + " (" + (e[1] ? "Verdadeiro" : "Falso") + ")" }), el("span", { text: e[2] })])); });
        rever = el("div", { class: "rever" }, [el("h3", { text: "Para rever antes da prova" }), ul]);
      }
      var acoes = el("div", { class: "acoes" }, [botao("Tentar de novo", relampago, "ouro"), botao("Voltar à trilha", inicio, "sec2")]);
      tela([el("section", { class: "fim" }, [
        el("h2", { text: k >= fila.length ? "Você respondeu a tudo!" : "Tempo esgotado!" }),
        el("div", { class: "nums" }, [
          el("div", {}, [el("b", { text: String(acertos) }), el("span", { text: "acertos" })]),
          el("div", {}, [el("b", { text: String(k) }), el("span", { text: "respondidas" })]),
          el("div", {}, [el("b", { text: String(estado.relampago) }), el("span", { text: "seu recorde" })])
        ]), acoes, rever
      ])]);
      barra(1); acoes.children[0].focus();
    }
    function responder(v) {
      if (acabou) return;
      var it = fila[k], certo = v === it[1];
      if (certo) acertos++; else erros.push(it);
      carta.classList.remove("flash-ok", "flash-no"); void carta.offsetWidth; carta.classList.add(certo ? "flash-ok" : "flash-no");
      marcador.textContent = "Acertos: " + acertos;
      k++;
      if (k >= fila.length) return fimJogo();
      carta.textContent = fila[k][0];
    }
    carta.textContent = fila[0][0];
    var cab = el("div", { class: "cab" }, [el("div", {}, [el("div", { class: "onde", text: "Todos os capítulos" }), el("h2", { text: "Verdadeiro ou falso?" })]), rel]);
    tela([cab, marcador, carta, el("div", { class: "opcoes vf" }, [
      el("button", { class: "op v", type: "button", text: "Verdadeiro", onclick: function () { responder(true); } }),
      el("button", { class: "op f", type: "button", text: "Falso", onclick: function () { responder(false); } })
    ])]);
    barra(0);
    cronometro = setInterval(function () {
      resta--; rel.textContent = resta + " s"; barra(1 - resta / TEMPO);
      if (resta <= 10) rel.classList.add("fim-tempo");
      if (resta <= 0) fimJogo();
    }, 1000);
  }

  document.getElementById("marca").addEventListener("click", function () { parar(); inicio(); });
  inicio();
})();
</script>
</body>
